  settings:{...DEFAULT_SETTINGS},
  backend:"local",
  firebaseReady:false,
  app:null,
  db:null,
  unsubs:[],
  data:{tasks:[],events:[],reflections:[],trainings:[],people:[],updates:[],updateHistory:[]},
  filters:{eventSearch:"",eventType:"전체",taskStatus:"전체"},
  editing:{tasks:null,events:null,reflections:null,trainings:null,people:null,updates:null},

  quickUpdateId:localStorage.getItem(QUICK_ID_KEY) || "",

};

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const today = () => new Date().toISOString().slice(0,10);
const makeId = () => crypto?.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);

function esc(v=""){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function br(v=""){return esc(v).replaceAll("\n","<br>")}
function dateVal(v){if(!v)return"";if(typeof v==="string")return v.slice(0,10);if(v.toDate)return v.toDate().toISOString().slice(0,10);if(v.seconds)return new Date(v.seconds*1000).toISOString().slice(0,10);return""}
function nowText(){return new Date().toLocaleString("ko-KR")}
function currentTabLabel(){return NAV.find(n=>n.id===state.activeTab)?.label || state.activeTab}
function getRecord(type, rid){return state.data[type]?.find(x=>x.id===rid)}

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const p = JSON.parse(raw);
    state.settings = {...DEFAULT_SETTINGS, ...(p.settings||{})};
    state.data = {...state.data, ...(p.data||{})};
  }catch(e){console.error(e);toast("로컬 데이터를 읽지 못했습니다.")}
}
function saveLocal(){localStorage.setItem(STORAGE_KEY, JSON.stringify({version:APP_VERSION,settings:state.settings,data:state.data}))}
function parseFirebase(text){if(!text||!text.trim())return null;try{const c=JSON.parse(text.trim());if(!c.apiKey||!c.projectId||!c.appId||String(c.apiKey).includes("YOUR_"))return null;return c}catch{return null}}
function colRef(type){return collection(state.db,"mcWorkspaces",state.settings.workspaceId||DEFAULT_SETTINGS.workspaceId,COLLECTIONS[type])}
function docRef(type,rid){return doc(state.db,"mcWorkspaces",state.settings.workspaceId||DEFAULT_SETTINGS.workspaceId,COLLECTIONS[type],rid)}

async function initFirebase(){
  const config = parseFirebase(state.settings.firebaseConfigText) || firebaseConfig;
  if(!config){state.backend="local";state.firebaseReady=false;syncStatus();return}
  try{
    state.app = initializeApp(config);
    state.db = getFirestore(state.app);
    state.backend = "firebase";
    state.firebaseReady = true;
    Object.keys(COLLECTIONS).forEach(type=>{
      const q = query(colRef(type), orderBy("createdAt","desc"));
      const unsub = onSnapshot(q, snap=>{
        state.data[type] = snap.docs.map(d=>({id:d.id,...d.data()}));
        render();
      }, err=>toast("Firestore 오류: "+err.message));
      state.unsubs.push(unsub);
    });
    syncStatus();
  }catch(e){console.error(e);state.backend="local";state.firebaseReady=false;syncStatus();toast("Firebase 연결 실패. 설정값을 확인하세요.")}
}
function syncStatus(){const dot=$("#syncDot"),txt=$("#syncText");if(!dot||!txt)return;dot.classList.toggle("on",state.firebaseReady);txt.textContent=state.firebaseReady?`Firestore 실시간 동기화 · ${state.settings.workspaceId}`:"브라우저 저장소 모드 · Firebase 설정 전"}

async function saveRecord(type, payload, rid="", options={}){
  const silent = !!options.silent;
  if(rid){
    if(state.backend==="firebase" && state.firebaseReady){
      await updateDoc(docRef(type,rid), {...payload, updatedAt: serverTimestamp()});
    }else{
      state.data[type] = state.data[type].map(x => x.id===rid ? {...x, ...payload, updatedAt:new Date().toISOString()} : x);
      saveLocal();
      render();
    }
    if(!silent)toast("수정 저장했습니다.");
    return rid;
  }
  if(state.backend==="firebase" && state.firebaseReady){
    const ref = await addDoc(colRef(type), {...payload, createdAt:serverTimestamp(), updatedAt:serverTimestamp()});
    if(!silent)toast("저장했습니다.");
    return ref.id;
  }
  const newId = makeId();
  state.data[type].unshift({id:newId, ...payload, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()});
  saveLocal();
  render();
  if(!silent)toast("저장했습니다.");
  return newId;
}
async function removeRecord(type,rid){
  if(!confirm("삭제할까요?"))return;
  if(state.backend==="firebase"&&state.firebaseReady){await deleteDoc(docRef(type,rid))}
  else{state.data[type]=state.data[type].filter(x=>x.id!==rid);saveLocal();render()}
  if(state.editing[type]===rid)state.editing[type]=null;
  toast("삭제했습니다.")
}
async function completeUpdate(rid){
  const item=state.data.updates.find(u=>u.id===rid);if(!item)return;
  const summary=prompt("업데이트 이력에 남길 요약을 입력하세요.",item.title||"업데이트 반영");if(!summary)return;
  const h={title:item.title||"업데이트 반영",summary,originalDetail:item.detail||"",appliedDate:today(),status:"반영완료"};
  if(state.backend==="firebase"&&state.firebaseReady){await addDoc(colRef("updateHistory"),{...h,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await deleteDoc(docRef("updates",rid))}
  else{state.data.updateHistory.unshift({id:makeId(),...h,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});state.data.updates=state.data.updates.filter(u=>u.id!==rid);saveLocal();render()}
  if(state.quickUpdateId===rid){state.quickUpdateId="";localStorage.removeItem(QUICK_ID_KEY);clearQuickDraft()}
  toast("요청 목록에서 제거하고 업데이트 이력에 남겼습니다.")
}
function toast(msg){const box=$("#toast");if(!box)return;const el=document.createElement("div");el.textContent=msg;box.appendChild(el);setTimeout(()=>el.remove(),3000)}
function showScreenChip(msg){const el=$("#screenChip");if(!el)return;el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}

function head(t,d,a=""){return `<div class="head"><div><h2>${esc(t)}</h2><p>${esc(d)}</p></div><div class="no-print">${a}</div></div>`}
function stat(t,v,d){return `<div class="card stat"><span>${esc(t)}</span><strong>${v}</strong><span>${esc(d)}</span></div>`}
function editBanner(type){const rid=state.editing[type];if(!rid)return"";return `<div class="edit-banner">이전 기록을 불러와 수정 중입니다. 저장하면 기존 기록이 수정됩니다.</div>`}
function formButtons(type, saveText="저장"){const editing=!!state.editing[type];return `<div class="full toolbar"><button class="brand" type="submit">${editing?"수정 저장":saveText}</button>${editing?`<button class="secondary" type="button" data-cancel-edit="${type}">새 기록으로 전환</button>`:""}</div>`}
function val(obj,key,def=""){return esc(obj?.[key] ?? def)}
function progressBar(v){const n=Math.max(0,Math.min(100,Number(v||0)));return `<div class="progress" aria-label="진행률 ${n}%"><span style="width:${n}%"></span></div>`}

function renderNav(){
  const c={dashboard:"",tasks:state.data.tasks.length,events:state.data.events.length,reflection:state.data.reflections.length,training:state.data.trainings.length,people:state.data.people.length,updates:state.data.updates.length,settings:""};
  $("#sideNav").innerHTML=NAV.map(n=>`<button class="${state.activeTab===n.id?"active":""}" data-tab="${n.id}"><span>${n.icon} ${n.label}</span>${c[n.id]!==""?`<span class="count">${c[n.id]}</span>`:""}</button>`).join("");
  $("#mobileNav").innerHTML=NAV.map(n=>`<option value="${n.id}" ${state.activeTab===n.id?"selected":""}>${n.icon} ${n.label}</option>`).join("");
  $$('[data-tab]').forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.tab;render()});
  $("#mobileNav").onchange=e=>{state.activeTab=e.target.value;render()};
}
function render(){
  renderNav();syncStatus();updateQuickScreen();
  const map={dashboard,tasks,events,reflection,training,people,updates,settings};
  $("#page").innerHTML=(map[state.activeTab]||dashboard)();
  bind();
}

function bind(){
  const formMap={taskForm:"tasks",eventForm:"events",reflectionForm:"reflections",trainingForm:"trainings",peopleForm:"people",updateForm:"updates"};
  Object.entries(formMap).forEach(([fid,type])=>{
    const form=$("#"+fid);
    form?.addEventListener("submit",async e=>{
      e.preventDefault();
      const payload=Object.fromEntries(new FormData(e.currentTarget).entries());
      const rid=state.editing[type]||"";
      await saveRecord(type,payload,rid);
      state.editing[type]=null;
      e.currentTarget.reset();
      render();
    });
  });
  $("#settingsForm")?.addEventListener("submit",e=>{e.preventDefault();state.settings={...state.settings,...Object.fromEntries(new FormData(e.currentTarget).entries())};saveLocal();toast("설정을 저장했습니다. Firebase 연결은 새로고침 후 적용됩니다.");setTimeout(()=>location.reload(),700)});
  $("#eventSearch")?.addEventListener("input",e=>{state.filters.eventSearch=e.target.value;render()});
  $("#eventTypeFilter")?.addEventListener("change",e=>{state.filters.eventType=e.target.value;render()});
  $("#taskStatusFilter")?.addEventListener("change",e=>{state.filters.taskStatus=e.target.value;render()});
  $$('[data-del]').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();const [t,rid]=b.dataset.del.split(":");removeRecord(t,rid)});
  $$('[data-complete]').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();completeUpdate(b.dataset.complete)});
  $$('[data-edit]').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();const [t,rid]=b.dataset.edit.split(":");openRecord(t,rid)});
  $$('[data-open-record]').forEach(el=>el.onclick=(ev)=>{if(ev.target.closest("button"))return;const [t,rid]=el.dataset.openRecord.split(":");openRecord(t,rid)});
  $$('[data-cancel-edit]').forEach(b=>b.onclick=()=>{state.editing[b.dataset.cancelEdit]=null;render();showScreenChip("새 기록 입력으로 전환했습니다.")});
  $$('[data-use-question]').forEach(b=>b.onclick=()=>{const input=$("#reflectionQuestion");if(input)input.value=b.dataset.useQuestion;scrollTo({top:0,behavior:"smooth"})});
  $$('[data-open-reflection]').forEach(b=>b.onclick=()=>{state.activeTab="reflection";render();setTimeout(()=>{$("#reflectionQuestion").value=b.dataset.openReflection},0)});
  $$('[data-go]').forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.go;render()});
  $$('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.copy||"");toast("복사했습니다.")});
  $("#loadPrepQuestionsBtn")?.addEventListener("click",()=>{const el=$("#prepAnswers");const text=PREP_QUESTIONS.map((q,i)=>`${i+1}. ${q}\n답변: `).join("\n\n");el.value = el.value ? el.value + "\n\n" + text : text;el.focus()});
  $("#openQuickFromPage")?.addEventListener("click",toggleQuickPanel);
  $("#exportBtn")?.addEventListener("click",()=>{const blob=new Blob([JSON.stringify({version:APP_VERSION,settings:state.settings,data:state.data},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`사회일지_백업_${today()}.json`;a.click();URL.revokeObjectURL(a.href)});
  $("#importBtn")?.addEventListener("click",()=>$("#importFile")?.click());
  $("#importFile")?.addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text());state.settings={...DEFAULT_SETTINGS,...(p.settings||{})};state.data={...state.data,...(p.data||{})};saveLocal();toast("백업을 불러왔습니다.");render()}catch{toast("백업 파일을 읽지 못했습니다.")}});
}

function openRecord(type,rid){
  if(!getRecord(type,rid)){toast("기록을 찾지 못했습니다.");return}
  const tab=TAB_BY_TYPE[type]||state.activeTab;
  state.activeTab=tab;
  if(state.editing[type]!==undefined)state.editing[type]=rid;
  render();
  setTimeout(()=>{const fid=FORM_BY_TYPE[type];const form=fid?$("#"+fid):null;if(form)form.scrollIntoView({behavior:"smooth",block:"start"});showScreenChip("이전 기록을 불러왔습니다. 수정 후 저장하세요.")},0);
}

  const draft=loadQuickDraft();
  const existing=state.quickUpdateId ? getRecord("updates",state.quickUpdateId) : null;
  const source=existing || draft;
  $("#quickTitle").value=source.title||"";
  $("#quickDetail").value=source.detail||"";
  $("#quickPriority").value=source.priority||"보통";
  setQuickSaveState(existing?"기존 메모 불러옴":draft.detail||draft.title?"임시 메모 불러옴":"대기 중");
}
function toggleQuickPanel(){
  state.quickOpen=!state.quickOpen;
  $("#quickPanel").classList.toggle("show",state.quickOpen);
  if(state.quickOpen){hydrateQuickPanel();setTimeout(()=>$("#quickDetail")?.focus(),60)}
}
async function autoSaveQuick(){
  const title=$("#quickTitle")?.value.trim()||"";
  const detail=$("#quickDetail")?.value.trim()||"";
  const priority=$("#quickPriority")?.value||"보통";
  const screen=$("#quickScreen")?.value||currentTabLabel();
  const draft={title,detail,priority,screen,savedAt:nowText(),date:today()};
  saveQuickDraft(draft);
  if(!title && !detail){setQuickSaveState("임시 저장됨");return}
  setQuickSaveState("저장 중...");
  const payload={title:title||`${screen} 화면 메모`,detail,priority,screen,savedAt:nowText(),date:today()};
  try{
    const rid=await saveRecord("updates",payload,state.quickUpdateId,{silent:true});
    state.quickUpdateId=rid;
    localStorage.setItem(QUICK_ID_KEY,rid);
    setQuickSaveState("자동 저장됨");
  }catch(e){console.error(e);setQuickSaveState("저장 실패");toast("업데이트 자동 저장에 실패했습니다.")}
}
function scheduleQuickSave(){clearTimeout(state.quickTimer);setQuickSaveState("입력 중...");state.quickTimer=setTimeout(autoSaveQuick,650)}
function bindGlobalActions(){
  $("#quickUpdateBtn").onclick=toggleQuickPanel;
  $("#quickCloseBtn").onclick=toggleQuickPanel;
  $("#chatgptLinkBtn").onclick=()=>window.open(CHATGPT_LINK,"_blank","noopener");
  $("#quickGoUpdatesBtn").onclick=()=>{state.activeTab="updates";if(state.quickOpen)toggleQuickPanel();render()};
  $("#quickNewBtn").onclick=()=>{state.quickUpdateId="";localStorage.removeItem(QUICK_ID_KEY);clearQuickDraft();toast("새 업데이트 메모를 시작합니다.")};
  ["#quickTitle","#quickDetail","#quickPriority"].forEach(s=>$(s).addEventListener("input",scheduleQuickSave));
  document.addEventListener("keydown",e=>{
    const key=e.key.toLowerCase();
    if(e.ctrlKey && !e.shiftKey && !e.altKey && key==="u"){
      e.preventDefault();
      toggleQuickPanel();
    }
    if(e.ctrlKey && !e.shiftKey && !e.altKey && key==="g"){
      e.preventDefault();
      window.open(CHATGPT_LINK,"_blank","noopener");
    }
    if(e.altKey&&!e.shiftKey&&!e.ctrlKey){const i=Number(e.key)-1;if(NAV[i]){state.activeTab=NAV[i].id;render()}}
  });
}

$("#randomInsightBtn").onclick=()=>{const q=CORE_QUESTIONS[Math.floor(Math.random()*CORE_QUESTIONS.length)];$("#todayInsight").textContent=`${q.title} — ${q.guide}`};
bindGlobalActions();
loadLocal();
render();
initFirebase();
</script>
</body>
